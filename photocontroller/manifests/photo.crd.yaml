apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: photos.sce.trainings.com
spec:
  group: sce.trainings.com
  scope: Namespaced
  names:
    kind: Photo
    listKind: PhotoList
    plural: photos
    singular: photo
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              url:
                type: string
              score:
                type: integer
          status:
            type: object
            properties:
              lastUpdated:
                type: string
                format: date-time
              processingStatus:
                type: string
              message:
                type: string
    additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.description
      name: Description
      type: string
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .spec.score
      name: Score
      type: integer
    - jsonPath: .status.processingStatus
      name: Status
      type: string
    selectableFields:
    - jsonPath: .spec.name
    - jsonPath: .spec.score
